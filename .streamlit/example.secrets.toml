# Example secrets for MCQ V3.
#
# Copy this file to .streamlit/secrets.toml and fill in the values. Streamlit
# only reads secrets.toml, which is gitignored; this example is committed, so
# never put a real key in it.

# -- Database (required) -------------------------------------------------------
# Supabase dashboard -> Project Settings -> API. The service-role key bypasses
# row-level security, so it must only ever live on the server. The environment
# variables SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY take precedence over
# these, which is handy for scripts.
[supabase]
url = "https://your-project-ref.supabase.co"
service_role_key = "your-service-role-key"

# -- Google sign-in (optional) -------------------------------------------------
# Without an [auth] section the sign-in page offers email and password only.
# The redirect URI must be registered on the OAuth client in Google Cloud
# Console, and must match the port the app runs on.
[auth]
redirect_uri = "http://localhost:8511/oauth2callback"
# Any long random string. One way to make one:
#   python -c "import secrets; print(secrets.token_hex(32))"
cookie_secret = "replace-with-a-long-random-string"

[auth.google]
client_id = "your-client-id.apps.googleusercontent.com"
client_secret = "your-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# -- Read with AI (optional) ---------------------------------------------------
# An OpenAI API key turns on the "Read with AI" button for question-bank
# uploads. Leave the section out and the button is simply not shown. OpenAI does
# not train on API traffic by default, but still don't upload files containing
# students' personal data.
[openai]
api_key = "your-openai-api-key"
# Optional: models to try, in order. A retired model (404) falls through to the
# next. Defaults to the list in ai_reader.DEFAULT_MODELS.
# models = ["gpt-5.4-mini", "gpt-4.1-mini"]

# -- Class time zone (optional) -------------------------------------------------
# Opening and closing times are read and shown in this zone, whatever zone the
# server itself runs in. Defaults to America/Chicago.
[app]
timezone = "America/Chicago"
